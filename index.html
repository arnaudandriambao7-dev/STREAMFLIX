<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéStream - Plateforme de Streaming</title>
  <link rel="stylesheet" href="style.css">
  <!-- Icônes FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- En-tête / Navigation -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-play"></i> Ciné<span>Stream</span>
    </div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="Rechercher un film, une série...">
    </div>
  </header>

  <!-- Bannière principale / Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 id="hero-title">Chargement...</h1>
      <p id="hero-overview"></p>
      <button class="btn-play" id="hero-play-btn">
        <i class="fa-solid fa-play"></i> Regarder maintenant
      </button>
    </div>
  </section>

  <!-- Contenu principal -->
  <main class="container">
    <h2 class="section-title">Films Tendances</h2>
    <div class="movie-grid" id="movie-grid"></div>
  </main>

  <!-- Lecteur Vidéo Modal -->
  <div class="modal" id="video-modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <div class="iframe-container">
        <div class="server-selector" style="margin-bottom: 15px; text-align: center;">
  <span style="font-size: 0.85rem; color: #aaa; margin-right: 10px;">Changer de lecteur :</span>
  <button onclick="changeServer(0)" style="background:#e50914; color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; margin:2px;">Serveur 1</button>
  <button onclick="changeServer(1)" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; margin:2px;">Serveur 2</button>
  <button onclick="changeServer(2)" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; margin:2px;">Serveur 3</button>
  <button onclick="changeServer(3)" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; margin:2px;">Serveur 4</button>
</div>
        <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
